name: Create Release For Tag
on: { push: { tags: [ 'v*' ] } }
jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: infrabits/ci-create-missing-release@068da76c5465d771733c70758742b113d523ff45 # v1.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: '${{ github.ref }}'
