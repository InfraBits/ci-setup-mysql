name: Create Release For Renovate
on: { push: { branches: [ 'main' ] } }
jobs:
  renovate-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.renovate-release.outputs.tag_name }}
    permissions:
      contents: write
    steps:
      - id: renovate-release
        uses: infrabits/ci-create-renovate-release@0d6889dab12b722a02ea7d85ecc578b57c11047d # v1.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
